<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur de Musique</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Choisis ton artiste</h1>
    <form action="/generate" method="post">
        <label for="artist">Artiste :</label>
        <select name="artist" id="artist">
            <option value="Drake">Drake</option>
            <option value="Beyonce">Beyoncé</option>
            <option value="Eminem">Eminem</option>
        </select><br>

        <label for="duration">Durée (en secondes) :</label>
        <input type="number" id="duration" name="duration" min="5" max="300" required><br>

        <input type="submit" value="Générer">
    </form>

    {% if mp3_exists %}
        <h2>Voici ta génération :</h2>
        <audio controls>
            <source src="{{ url_for('static', filename='generated/mp3/result.mp3') }}" type="audio/mpeg">
            Ton navigateur ne supporte pas l'audio HTML.
        </audio>
        <br><br>
        <a href="{{ url_for('static', filename='generated/result.mp3') }}" download>Télécharger le fichier MP3</a>
    {% endif %}
</body>
</html>
